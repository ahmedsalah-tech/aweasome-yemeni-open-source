name: Validate catalog

# Runs on every pull request. This is the required check that gates merging:
# it verifies the project table is well formed and that each entry the pull
# request adds meets the rules in CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged result
        uses: actions/checkout@v4

      - name: Fetch the README from the base branch
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git show "FETCH_HEAD:README.md" > "${RUNNER_TEMP}/base-README.md"

      - name: Validate the catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_REMOVALS: ${{ contains(github.event.pull_request.labels.*.name, 'entry-removal') }}
        run: |
          args=(check --readme README.md --base "${RUNNER_TEMP}/base-README.md")
          if [ "$ALLOW_REMOVALS" = "true" ]; then args+=(--allow-removals); fi
          python3 scripts/catalog.py "${args[@]}"
