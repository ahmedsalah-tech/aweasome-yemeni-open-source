name: Sync catalog with main

# Keeps every open pull request mergeable. Instead of merging two versions of
# the same numbered table -- which conflicts whenever two contributors pick the
# same row number -- the entries a pull request adds are re-applied on top of
# the current main and the whole index is renumbered.
#
# Requires the CATALOG_BOT_TOKEN secret: the default GITHUB_TOKEN cannot push to
# a contributor's fork. The job skips itself, harmlessly, when it is not set.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    if: github.event.pull_request.state == 'open' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Look for the bot token
        id: token
        env:
          BOT_TOKEN: ${{ secrets.CATALOG_BOT_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CATALOG_BOT_TOKEN is not set, so the catalog was not synced automatically."
          fi

      # The tooling always comes from main, never from the pull request, so a
      # contributor cannot change what runs here.
      - name: Check out main
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main

      - name: Check out the pull request branch
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.CATALOG_BOT_TOKEN }}
          path: pr
          fetch-depth: 0

      - name: Rebuild the catalog on top of main
        if: steps.token.outputs.present == 'true'
        id: sync
        working-directory: pr
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          git remote add upstream "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags upstream "$DEFAULT_BRANCH:refs/remotes/upstream/$DEFAULT_BRANCH"

          merge_base=$(git merge-base "upstream/$DEFAULT_BRANCH" HEAD)
          git show "$merge_base:README.md" > "${RUNNER_TEMP}/merge-base-README.md"

          set +e
          python3 ../main/scripts/catalog.py sync \
            --main ../main/README.md \
            --merge-base "${RUNNER_TEMP}/merge-base-README.md" \
            --head README.md \
            --out "${RUNNER_TEMP}/synced-README.md"
          status=$?
          set -e

          if [ "$status" -eq 2 ]; then
            echo "::notice::This pull request does more than add entries, so it was left untouched."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::The catalog could not be synced automatically."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "action=apply" >> "$GITHUB_OUTPUT"

      - name: Commit and push the result
        if: steps.token.outputs.present == 'true' && steps.sync.outputs.action == 'apply'
        working-directory: pr
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Record main as merged while keeping our tree: the synced README
          # already contains everything on main plus this pull request's rows.
          git merge --no-commit -s ours "upstream/$DEFAULT_BRANCH" \
            -m "Merge main into the pull request branch" || true

          cp "${RUNNER_TEMP}/synced-README.md" README.md
          git add README.md

          if git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ]; then
            echo "Already in sync with main; nothing to push."
            exit 0
          fi

          git commit -m "Sync the catalog with main and renumber the project index"
          git push origin "HEAD:$HEAD_REF"
